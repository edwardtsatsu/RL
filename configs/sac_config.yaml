seeds: [0, 1, 2]
total_timesteps: 150000

reward:
  cost_weight: 1.0
  peak_penalty_weight: 0.1
  self_consumption_weight: 0.05

baseline:
  min_soc_reserve: 0.1

eval_start_time_step: 6552
eval_window_steps: 72
eval_num_windows: 30

# Every key below is an explicit SB3 SAC constructor argument. Values match
# the SB3 2.3.2 default except total_timesteps and seed (set per-run, not
# stored here). The exam requires every hyperparameter to be stated, so all
# of them are listed even where unchanged from the library default.
sac:
  learning_rate: 0.0003
  buffer_size: 1000000
  learning_starts: 100
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: "auto"
